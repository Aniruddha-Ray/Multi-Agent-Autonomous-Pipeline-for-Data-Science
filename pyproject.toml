[tool.poetry]
name = "adaptive-ds-agents"
version = "0.1.0"
description = "Adaptive Multi-Agent Planning for Autonomous Data Science Pipelines using Large Language Models"
authors = ["Adaptive DS Agents Team"]
readme = "README.md"
license = "Proprietary"
packages = [
    { include = "backend" },
    { include = "agents" },
    { include = "memory" },
    { include = "services" },
    { include = "database" },
    { include = "ml" },
    { include = "evaluation" },
    { include = "report_generation" },
    { include = "config" },
    { include = "infrastructure" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

# --- Backend / API ---
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
python-multipart = "^0.0.12"
websockets = "^13.1"

# --- Frontend ---
streamlit = "^1.40.0"

# --- Config / Validation ---
pydantic = "^2.9.2"
pydantic-settings = "^2.6.0"

# --- Database / ORM ---
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
alembic = "^1.13.3"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.10"
greenlet = "^3.1.1"

# --- Cache / Broker / Tasks ---
redis = "^5.2.0"
celery = { extras = ["redis"], version = "^5.4.0" }
flower = "^2.0.1"

# --- Vector DB / Knowledge Graph ---
qdrant-client = "^1.12.1"
neo4j = "^5.26.0"

# --- Experiment Tracking / Object Storage ---
mlflow = "^2.17.2"
minio = "^7.2.10"
boto3 = "^1.35.60"

# --- LLM / Agent Framework (infra hooks only in Stage 2) ---
langchain = "^0.3.7"
langchain-openai = "^0.2.9"
langchain-anthropic = "^0.3.0"
langchain-community = "^0.3.7"
langgraph = "^0.3.0"
langgraph-checkpoint-postgres = "^2.0.4"
langgraph-checkpoint-redis = "^0.0.4"

# --- Logging / Tracing ---
loguru = "^0.7.2"
opentelemetry-api = "^1.28.1"
opentelemetry-sdk = "^1.28.1"
opentelemetry-instrumentation-fastapi = "^0.49b1"
opentelemetry-exporter-otlp = "^1.28.1"
langsmith = "^0.1.147"

# --- Security ---
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }

# --- HTTP client (internal service calls, health checks) ---
httpx = "^0.27.2"

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
scikit-learn = "^1.5.2"
xgboost = "^2.1.2"
lightgbm = "^4.5.0"
catboost = "^1.2.7"
optuna = "^4.1.0"
shap = "^0.46.0"
pandas = "^2.2.3"
polars = "^1.13.1"
numpy = "^2.1.3"
scipy = "^1.14.1"
plotly = "^5.24.1"
matplotlib = "^3.9.2"

[tool.poetry.group.dev]
optional = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
ruff = "^0.7.4"
black = "^24.10.0"
mypy = "^1.13.0"
pre-commit = "^4.0.1"
faker = "^33.0.0"
types-redis = "^4.6.0.20241004"
types-passlib = "^1.7.7.20240819"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

# =========================================================
# Tool configuration
# =========================================================

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "agents", "memory", "services", "database", "ml", "evaluation", "report_generation", "config", "infrastructure", "tests"]
exclude = ["migrations", ".venv", "frontend/streamlit_app/pages"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "ASYNC",            # async-specific lint rules
    "RUF",              # ruff-specific rules
]
ignore = ["E501"]  # line length enforced by black instead

[tool.ruff.lint.isort]
known-first-party = [
    "backend", "agents", "memory", "services", "database",
    "ml", "evaluation", "report_generation", "config", "infrastructure",
]

[tool.black]
target-version = ["py312"]
line-length = 100
include = '\.pyi?$'
extend-exclude = '''
(
  /migrations/
  | /\.venv/
)
'''

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
show_error_codes = true
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["mlflow.*", "qdrant_client.*", "neo4j.*", "minio.*", "shap.*", "catboost.*", "langgraph.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, no external services",
    "integration: requires Postgres/Redis/Qdrant/Neo4j/MLflow",
    "e2e: full stack via docker compose",
]

[tool.coverage.run]
source = [
    "backend", "agents", "memory", "services", "database",
    "ml", "evaluation", "report_generation", "config", "infrastructure",
]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
fail_under = 0
